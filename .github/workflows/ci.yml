name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The grammar-coverage report is generated; this fails the build if a content change drops a "Muss" item of
      # the B2 inventory below four exercises, and keeps the committed report from silently going stale.
      - name: Grammar coverage gate (tools/grammar-coverage.py --check)
        run: python3 tools/grammar-coverage.py --check

      - name: Restore
        run: dotnet restore Lotse.slnx

      - name: Format gate (dotnet format --verify-no-changes)
        run: dotnet format Lotse.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Lotse.slnx --no-restore -c Release

      - name: Install Playwright Chromium
        run: pwsh tests/Lotse.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test (engine, content, service, components, host, E2E)
        run: dotnet test Lotse.slnx --no-build -c Release

      - name: Upload Playwright traces (failures only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: tests/Lotse.E2E/bin/Release/net10.0/playwright-traces/
          if-no-files-found: ignore

  # The image a server would run: it must build, start, migrate an empty volume and answer as the demo instance.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t lotse:ci .

      - name: Start with a demo account and check it answers
        run: |
          docker run -d --name lotse -p 8080:8080 \
            -e Lotse__Hosting__Demo__Enabled=true -e Lotse__Hosting__RegistrationOpen=false lotse:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/Account/Login | grep -q "Demo ansehen"
          curl -fsS http://localhost:8080/Account/Register | grep -q "Registrierung geschlossen"

      - name: Container log
        if: always()
        run: docker logs lotse || true
