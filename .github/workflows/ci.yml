name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Lotse.slnx
      - name: Build
        run: dotnet build Lotse.slnx --no-restore -c Release
      - name: Test (engine, service, content integrity)
        run: dotnet test Lotse.slnx --no-build -c Release
